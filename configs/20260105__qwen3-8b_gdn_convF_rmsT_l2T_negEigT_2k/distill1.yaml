model:
  ctx_len: 2048

train:
  wandb: qwen2rwkv
  
  proj_suffix: 1
  train_stage: 3
  load_partial: 1

  data_type: "binidx" 
  data_file: "/mnt/nfs/parsa/data/radlad_data_steps/stag0_100M"
  # NOTE: Calculate magic_prime using: python3 make_data_hf.py check /mnt/nfs/parsa/data/radlad_data_steps/stag0_100M 2048
  # Update my_exit_tokens based on your actual dataset size
  my_exit_tokens: 100000000  # Update this based on your dataset size
  magic_prime: 48827  # PLACEHOLDER - Calculate using make_data_hf.py check command above

  optimizer: dsfusedadamw
  lr_decay_type: cos
  lr_init: 1e-3
  lr_final: 1e-5
  warmup_steps: 50
  beta1: 0.9 
  beta2: 0.95
  adam_eps: 1e-8 
  weight_decay: 0

  devices: 8
  num_nodes: 1
  micro_bsz: 2  # Reduced for 2048 ctx_len (higher memory usage)
  accumulate_grad_batches: 1
  strategy: deepspeed_stage_1
  grad_cp: 0
  ds_bucket_mb: 200
    
  attention_distillation_stage: 1
  epoch_save: 1

